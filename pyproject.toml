[project]
name = "codex-proxy"
version = "0.1.0"
description = "A retrying reverse proxy for the Codex CLI that hides transient upstream capacity errors."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
codex-proxy = "codex_proxy.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codex_proxy"]
